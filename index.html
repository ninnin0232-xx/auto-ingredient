<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Ingredient | 自動材料計算</title>
    <!-- 温かみを持たせるためのフォント変更 (Shippori Mincho, M PLUS Rounded 1c) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <h1>Auto Ingredient</h1>
            <div class="ornament">〜 自動材料計算 〜</div>
        </div>
        <p>レストランの仕込みのように、必要な材料を自動でリストアップします。</p>
    </header>

    <main class="container">
        <section class="menu-section">
            <h2 class="section-title"><span>Menu</span>お品書き</h2>
            <div class="recipe-grid" id="recipe-grid">
                <!-- レシピボタンがここに生成されます -->
            </div>
        </section>

        <section class="output-section">
            <div class="receipt-paper">
                <div class="output-header">
                    <h2><span>Selected</span>ご注文内容</h2>
                    <span class="selected-count" id="selected-count">0</span>
                </div>

                <div class="cart-list">
                    <ul id="cart-ul">
                        <li class="empty-message">レシピをタップして追加してください</li>
                    </ul>
                </div>

                <div class="divider"></div>

                <div class="total-ingredients-header">
                    <h3><span>List</span>必要な材料</h3>
                </div>
                <div class="ingredients-list">
                    <ul id="ingredients-ul">
                        <li class="empty-message">材料がここに表示されます</li>
                    </ul>
                </div>

                <div class="receipt-footer">
                    Thank you
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
